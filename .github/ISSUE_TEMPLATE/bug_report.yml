name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Found a way to get a secret's value out of Veil?** Please don't file it here.
        Report it privately as described in [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran. Never paste real secret values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: veil --version, OS, and agent (Claude Code, Cursor, ...)
    validations:
      required: true
